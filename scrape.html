<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页图片直传 · Tele 素材库</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1020; color: #d8d8e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
.container { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font-size: 22px; margin-bottom: 6px; color: #fff; }
.sub { color: #8a8aa8; font-size: 13px; margin-bottom: 24px; line-height: 1.7; }
.card { background: #181a30; border: 1px solid #2a2c4a; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.input-group { display: flex; gap: 10px; }
input[type=text], input[type=url], input[type=number] { flex: 1; background: #0f1020; color: #e8e8f8; border: 1px solid #3a3c5a; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
input:focus { border-color: #00d4ff; }
.btn { background: #252848; color: #fff; border: 1px solid #3a3c5a; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #2f3358; }
.btn.primary { background: #0072ff; border-color: #0072ff; }
.btn.primary:hover { background: #1a83ff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.status { margin-top: 12px; font-size: 13px; min-height: 18px; }
.status.ok { color: #00ff88; }
.status.err { color: #ff6666; }
.loading { display: inline-block; width: 14px; height: 14px; border: 2px solid #3a3a5a; border-top-color: #00d4ff; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.opts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.opts .field { flex: 1; min-width: 160px; }
.opts label { display: block; font-size: 12px; color: #8a8aa8; margin-bottom: 4px; }
.ign { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.ign .ig-label { font-size: 12px; color: #8a8aa8; white-space: nowrap; }
.ign input[type=text] { flex: 1; min-width: 150px; }
.ign input[type=number] { flex: 0 0 auto; width: 100px; }
select { background: #0f1020; color: #e8e8f8; border: 1px solid #3a3c5a; border-radius: 8px; padding: 9px 10px; width: 100%; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
.cand { position: relative; background: #0f1020; border: 1px solid #3a3c5a; border-radius: 8px; overflow: hidden; }
.cand .ph { position: relative; display: block; width: 100%; height: 110px; background: #22243c; overflow: hidden; }
.cand .ph-ico { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5a5a7a; }
.cand .ph img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.cand input { position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; z-index: 2; accent-color: #0072ff; }
.cand .nm { font-size: 10px; color: #8a8aa8; padding: 4px 6px; word-break: break-all; height: 28px; line-height: 13px; overflow: hidden; }
.cand.sel { border-color: #0072ff; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.count { font-size: 12px; color: #8a8aa8; }
.result-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed #2a2c4a; font-size: 13px; }
.result-item .rk { width: 20px; text-align: center; color: #666; }
.result-item .ok { color: #00ff88; }
.result-item .fail { color: #ff6666; }
.result-item .skip { color: #eab308; }
.result-item .u { flex: 1; word-break: break-all; color: #aaa; }
.sum { margin-top: 10px; font-size: 13px; }
a.link { color: #00d4ff; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🖼 网页图片直传</h1>
  <div class="sub">输入包含图片的网页链接，自动拾取 <b>&lt;img&gt;</b>、CSS <b>background</b>、懒加载（data-src）等图片；勾选后把原图发送到「上传群」并写入 Tele 库（代理存储，不占 R2）。</div>

  <div class="card">
    <div class="input-group">
      <input type="url" id="scUrl" placeholder="粘贴网页链接，例如 https://example.com/post/123">
      <button class="btn primary" id="scAnalyzeBtn">拾取图片</button>
    </div>
    <div class="status" id="scStatus"></div>
  </div>

  <div class="card" id="candCard" style="display:none">
    <div class="opts">
      <div class="field" style="min-width:220px;flex:2"><label>标题（可选，默认用页面标题）</label><input type="text" id="scTitle" placeholder="默认取网页 title"></div>
      <div class="field"><label>标签（逗号分隔，可选）</label><input type="text" id="scTags" placeholder="风景,美女"></div>
      <div class="field"><label>入库级别</label><select id="scLevel"><option value="pt">pt</option><option value="vip">vip</option><option value="svip">svip</option><option value="vvip">vvip</option></select></div>
    </div>
    <div class="ign">
      <span class="ig-label">忽略规则</span>
      <input type="text" id="scIgKw" placeholder="链接含以下内容则忽略（逗号分隔，如 logo,icon,avatar,1px）">
      <input type="text" id="scIgExt" placeholder="忽略格式（如 svg,bmp,ico）" value="svg">
      <input type="number" id="scIgMb" placeholder="单张上限MB" value="10" min="1" max="30">
    </div>
    <div class="toolbar">
      <span class="count">共 <span id="scCount">0</span> 张 · 已选 <span id="scSelCount">0</span> 张</span>
      <button class="btn ghost" id="scSelAll">全选</button>
      <button class="btn ghost" id="scSelNone">全不选</button>
      <button class="btn ghost" id="scSelSmall" title="只勾选前 20 张">只选前 20 张</button>
      <button class="btn primary" id="scGrabBtn" disabled>直传选中到 Tele 库</button>
    </div>
    <div class="grid" id="scGrid"></div>
    <div class="sum" id="scSum" style="display:none"></div>
    <div class="status" id="scGrabStatus"></div>
    <div id="scResult"></div>
    <div style="margin-top:12px;font-size:12px;color:#8a8aa8">勾选图片将作为 document 消息发送到「上传群」，按返回 file_id 入库（source=代理），可在 <a class="link" href="/admin#files" target="_blank">admin → Tele 文件</a> 查看。需先在 admin「运维 → 用户上传配置」设置上传群组。</div>
  </div>
</div>

<script>
var API_KEY = new URLSearchParams(window.location.search).get('api_key') || localStorage.getItem('admin_api_key') || localStorage.getItem('ak') || '';
if (!API_KEY) {
  var input = prompt('请输入 API Key（从 admin 后台获取）');
  if (input) { API_KEY = input; localStorage.setItem('ak', API_KEY); }
}
var OR = location.origin;
var cands = [];

function escStr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// 解码 HTML 实体（&#8211; → –），避免标题/输入框显示原始实体文本
function decodeEnt(s) {
  if (s == null) return '';
  var t = document.createElement('textarea');
  t.innerHTML = String(s);
  return t.value;
}

// 预览图加载失败：仅隐藏 <img> 露出占位图标，保留卡片与复选框（仍可勾选直传）
function imgErr(img) {
  if (!img) return;
  img.style.display = 'none';
  var holder = img.parentNode;
  if (holder) holder.classList.add('ph-fail');
}

function api(method, path, body, timeoutMs) {
  var url = OR + path + '?api_key=' + encodeURIComponent(API_KEY);
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  if (timeoutMs) {
    var ctl = new AbortController();
    opts.signal = ctl.signal;
    setTimeout(function() { ctl.abort(); }, timeoutMs);
  }
  return fetch(url, opts).then(function(r) {
    return r.text().then(function(t) {
      try { return JSON.parse(t); }
      catch (e) { return { ok: false, error: '服务响应异常（HTTP ' + r.status + '）' }; }
    });
  });
}

function setStatus(id, text, ok) {
  var el = document.getElementById(id);
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.innerHTML = text;
}
function setLoading(btn, on, label) {
  if (on) { btn.disabled = true; btn.innerHTML = '<span class="loading"></span>' + (label || '处理中...'); }
  else { btn.disabled = false; btn.textContent = label || '直传选中到 Tele 库'; }
}

function analyze() {
  var url = document.getElementById('scUrl').value.trim();
  if (!/^https?:\/\//i.test(url)) { setStatus('scStatus', '请输入 http(s) 网页链接', 0); return; }
  var btn = document.getElementById('scAnalyzeBtn');
  setLoading(btn, true, '拾取中...');
  setStatus('scStatus', '正在抓取页面并提取图片...', 1);
  document.getElementById('candCard').style.display = 'none';
  api('POST', '/admin/api/scrape/analyze', { url: url }, 60000)
    .then(function(d) {
      setLoading(btn, false, '拾取图片');
      if (!d.ok) { setStatus('scStatus', d.error || '拾取失败', 0); return; }
      cands = (d.data && d.data.images) || [];
      document.getElementById('scTitle').value = decodeEnt(d.data && d.data.title);
      var card = document.getElementById('candCard');
      card.style.display = '';
      renderGrid();
      setStatus('scStatus', '页面解析成功：找到 ' + cands.length + ' 张候选图片，勾选后点「直传选中到 Tele 库」', 1);
      document.getElementById('scGrabStatus').textContent = '';
      document.getElementById('scResult').innerHTML = '';
      var sumEl = document.getElementById('scSum');
      if (sumEl) sumEl.style.display = 'none';
      if (!cands.length) setStatus('scStatus', '页面解析完成，但没有找到可用图片', 0);
    })
    .catch(function(e) { setLoading(btn, false, '拾取图片'); setStatus('scStatus', '请求失败: ' + e.message, 0); });
}

function renderGrid() {
  var g = document.getElementById('scGrid');
  var h = '';
  for (var i = 0; i < cands.length; i++) {
    var u = cands[i];
    var nm = u.replace(/^https?:\/\//, '').slice(0, 60);
    h += '<label class="cand" data-i="' + i + '">' +
      '<span class="ph"><span class="ph-ico">🖼</span>' +
      '<img loading="lazy" referrerpolicy="no-referrer" src="' + escStr(u) + '" alt="" onerror="imgErr(this)">' +
      '</span>' +
      '<input type="checkbox" data-cand="' + i + '">' +
      '<div class="nm" title="' + escStr(u) + '">' + escStr(nm) + '</div></label>';
  }
  document.getElementById('scCount').textContent = cands.length;
  g.innerHTML = h || '<div style="grid-column:1/-1;color:#666;padding:16px;text-align:center">无候选图片</div>';
  updateSelCount();
}

function selectedUrls() {
  var out = [];
  for (var i = 0; i < cands.length; i++) {
    var cb = document.querySelector('input[data-cand="' + i + '"]');
    if (cb && cb.checked) out.push(cands[i]);
  }
  return out;
}
function updateSelCount() {
  var n = selectedUrls().length;
  document.getElementById('scSelCount').textContent = n;
  document.getElementById('scGrabBtn').disabled = n === 0;
}

function grab() {
  var urls = selectedUrls();
  var st = document.getElementById('scGrabStatus');
  var sum = document.getElementById('scSum');
  if (!urls.length) {
    st.className = 'status err';
    st.textContent = '未勾选任何图片：请先在全选/候选图上打勾';
    if (sum) sum.style.display = 'none';
    return;
  }
  var btn = document.getElementById('scGrabBtn');
  setLoading(btn, true, '直传中...');
  var title = document.getElementById('scTitle').value.trim();
  var tags = document.getElementById('scTags').value.trim();
  var level = document.getElementById('scLevel').value;
  var pageUrl = document.getElementById('scUrl').value.trim();
  var ignoreKw = document.getElementById('scIgKw').value.trim();
  var ignoreExt = document.getElementById('scIgExt').value.trim();
  var maxMb = parseInt(document.getElementById('scIgMb').value, 10);
  if (!(maxMb > 0)) maxMb = 30;
  st.className = 'status';
  st.innerHTML = '<span class="loading"></span>正在逐张下载并发送到群（' + urls.length + ' 张，可能需要一会儿）...';
  document.getElementById('scResult').innerHTML = '';
  if (sum) sum.style.display = 'none';
  // 长任务：总超时放宽到 10 分钟
  api('POST', '/admin/api/scrape/grab', { urls: urls, title: title, tags: tags, level: level, ref: pageUrl, ignore_kw: ignoreKw, ignore_ext: ignoreExt, max_mb: maxMb }, 600000)
    .then(function(d) {
      setLoading(btn, false, '直传选中到 Tele 库');
      if (!d.ok) { st.className = 'status err'; st.textContent = d.error || '直传失败'; return; }
      var added = d.data.added || 0;
      var failed = d.data.failed || 0;
      var ignoredN = d.data.ignored || 0;
      st.className = 'status ' + (added > 0 ? 'ok' : 'err');
      var msg = '直传完成：成功 ' + added + ' 张';
      if (ignoredN) msg += '，忽略 ' + ignoredN + ' 张';
      if (failed) msg += '，失败 ' + failed + ' 张';
      if (!added && !ignoredN && !failed) msg = '直传完成：没有需要处理的图片';
      st.textContent = msg;
      if (sum) {
        sum.innerHTML = '<b>' + added + '</b> 成功 · <span class="skip">' + ignoredN + '</span> 忽略 · <span class="fail">' + failed + '</span> 失败（共勾选 ' + urls.length + ' 张）';
        sum.style.display = 'block';
      }
      var rows = (d.data && d.data.results) || [];
      var h = rows.map(function(r, i) {
        var ico, cls, why;
        if (r.ignored) { ico = '–'; cls = 'skip'; why = r.error || '忽略'; }
        else if (r.ok) { ico = '✓'; cls = 'ok'; why = '#' + (r.id || ''); }
        else { ico = '✗'; cls = 'fail'; why = r.error || '失败'; }
        return '<div class="result-item"><span class="rk">' + (i + 1) + '</span>' +
          '<span class="' + cls + '">' + ico + '</span>' +
          '<span class="u">' + escStr(r.url) + '</span>' +
          '<span class="' + cls + '" style="white-space:nowrap">' + escStr(why) + '</span></div>';
      }).join('');
      document.getElementById('scResult').innerHTML = h;
      if (added) {
        document.getElementById('scResult').innerHTML += '<div class="sum">入库 ' + added + ' 张到 Tele 库（代理直传）。<a class="link" href="/admin#files" target="_blank">去 admin 查看 →</a></div>';
      }
      st.scrollIntoView({ behavior: 'smooth', block: 'start' });
    })
    .catch(function(e) { setLoading(btn, false, '直传选中到 Tele 库'); st.className = 'status err'; st.textContent = '请求失败或超时: ' + (e && e.message ? e.message : e); });
}

document.getElementById('scAnalyzeBtn').addEventListener('click', analyze);
document.getElementById('scUrl').addEventListener('keydown', function(e) { if (e.key === 'Enter') analyze(); });
document.getElementById('scGrid').addEventListener('change', function(e) {
  var t = e.target;
  if (t && t.hasAttribute('data-cand')) {
    var box = t.closest('.cand');
    if (box) box.classList.toggle('sel', t.checked);
    updateSelCount();
  }
});
document.getElementById('scSelAll').addEventListener('click', function() {
  document.querySelectorAll('input[data-cand]').forEach(function(cb) { cb.checked = true; var box = cb.closest('.cand'); if (box) box.classList.add('sel'); });
  updateSelCount();
});
document.getElementById('scSelNone').addEventListener('click', function() {
  document.querySelectorAll('input[data-cand]').forEach(function(cb) { cb.checked = false; var box = cb.closest('.cand'); if (box) box.classList.remove('sel'); });
  updateSelCount();
});
document.getElementById('scSelSmall').addEventListener('click', function() {
  document.querySelectorAll('input[data-cand]').forEach(function(cb) { cb.checked = false; var box = cb.closest('.cand'); if (box) box.classList.remove('sel'); });
  var n = Math.min(20, cands.length);
  for (var i = 0; i < n; i++) {
    var cb = document.querySelector('input[data-cand="' + i + '"]');
    if (cb) { cb.checked = true; var box = cb.closest('.cand'); if (box) box.classList.add('sel'); }
  }
  updateSelCount();
});
document.getElementById('scGrabBtn').addEventListener('click', grab);
</script>
</body>
</html>
