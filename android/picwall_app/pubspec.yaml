name: picwall_app
description: PicWall / 图墙 — Android client for Telegram R2 Worker library.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  sqflite: ^2.3.3
  share_plus: ^12.0.2
  gal: ^2.3.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  http_parser: ^4.0.2
  photo_manager: ^3.12.0
  package_info_plus: ^8.0.0
  flutter_foreground_task: ^8.0.0
  workmanager: ^0.10.9
  local_auth: ^2.3.0
  crypto: ^3.0.3
  video_player: ^2.8.2
  device_info_plus: ^11.1.0
  uuid: ^4.5.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: '#6C7CFF'
  adaptive_icon_foreground: assets/icons/app_icon_fg.png
  min_sdk_android: 21
