name: picwall_app
description: PicWall / 图墙 — Android client for Telegram R2 Worker library.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  sqflite: ^2.3.3
  share_plus: ^7.2.2
  gal: ^2.3.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
