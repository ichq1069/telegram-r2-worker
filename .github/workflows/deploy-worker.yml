# GitHub Actions：推送 main 分支即自动部署 Worker 并上传 admin.html 到 R2
# 本仓库根目录就是 Worker 项目（wrangler.toml / worker.js / admin.html 都在根）
# 需要的 GitHub Secrets（仓库 → Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN : Cloudflare API Token（权限：Account.Cloudflare Workers Scripts:Edit、
#                         Account.D1:Edit、Account.R2 Storage:Edit、Account.Workers R2 Storage:Edit、
#                         Account.Account Settings:Read）
#   CLOUDFLARE_ACCOUNT_ID: Cloudflare 账号 ID（77fc93b832a9f816ee841c3a321b57b5）
#   TG_BOT_TOKEN         : Telegram Bot Token（每次部署自动写入 Worker 的 Secret，不再依赖 Dashboard）
#   API_KEY              : Worker Admin API Key（同上）
#   TG_SECRET            : Webhook Secret —— 暂不自动部署（webhook 未配 secret_token 时不需要；
#                          若以后要启用，在 GitHub Secrets 加 TG_SECRET 并在此列表补一行）
name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check worker.js
          for f in src/*.js; do node --check "$f"; done

      # 一劳永逸：每次部署前，把 2 个 Secret 写入 Worker（wrangler secret put）。
      # 这样 TG_BOT_TOKEN 不会因部署而丢失，Dashboard 里也无需再手动配置这些机密。
      # 用 shell 方式直写，避免 wrangler-action 的 secrets 输入语法兼容问题。
      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "$TG_BOT_TOKEN" | npx --yes wrangler secret put TG_BOT_TOKEN
          echo "$API_KEY" | npx --yes wrangler secret put API_KEY

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Upload admin.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/admin.html --file=admin.html --content-type text/html --cache-control "public, max-age=300"
