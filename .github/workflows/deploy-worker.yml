# GitHub Actions：推送 main 分支即自动部署 Worker 并上传 admin.html 到 R2
# 本仓库根目录就是 Worker 项目（wrangler.toml / worker.js / admin.html 都在根）
# 需要的 GitHub Secrets（仓库 → Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN : Cloudflare API Token（权限：Account.Cloudflare Workers Scripts:Edit、
#                         Account.D1:Edit、Account.R2 Storage:Edit、Account.Workers R2 Storage:Edit、
#                         Account.Account Settings:Read）
#   CLOUDFLARE_ACCOUNT_ID: Cloudflare 账号 ID（77fc93b832a9f816ee841c3a321b57b5）
#   TG_BOT_TOKEN         : Telegram Bot Token（每次部署自动写入 Worker 的 Secret，不再依赖 Dashboard）
#   API_KEY              : Worker Admin API Key（同上）
#   CF_API_TOKEN         : （可选）Cloudflare API Token（权限：Account.R2 Storage:Read）——
#                          后台 R2 用量显示官方真实数据（GraphQL Analytics）；不配则回退本地估算
#   TG_SECRET            : Webhook Secret —— 暂不自动部署（webhook 未配 secret_token 时不需要；
#                          若以后要启用，在 GitHub Secrets 加 TG_SECRET 并在此列表补一行）
name: Deploy Worker

on:
  push:
    branches: [main]
    # 安卓端目录的改动只构建 APK（见 build-android.yml），不触发 Worker 部署
    paths-ignore:
      - 'android/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check worker.js
          for f in src/*.js; do node --check "$f"; done

      # 安装依赖（mysql2 等外部包），wrangler deploy 打包时需要
      - name: Install dependencies
        run: npm ci

      # Cloudflare 版本管理限制：最新版本未部署时不允许 wrangler secret put。
      # 所以顺序必须：先 deploy 部署版本，再 secret put 写入机密。
      # wrangler-action@v4（声明 node24）兼容 GitHub Actions 默认 Node 24 runner；
      # @v3 声明 node20 已被 GitHub 弃用（2025-09 起默认不再运行），导致 npx 退出码 1。
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.128.0"
          command: deploy

      # 部署后写入 3 个 Secret，一劳永逸避免部署丢 token。
      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "$TG_BOT_TOKEN" | npx --yes wrangler secret put TG_BOT_TOKEN
          echo "$API_KEY" | npx --yes wrangler secret put API_KEY
          # CF_API_TOKEN（R2 官方用量查询）未单独配置时复用 CLOUDFLARE_API_TOKEN（权限包含 R2 Read）
          if [ -n "$CF_API_TOKEN" ]; then echo "$CF_API_TOKEN" | npx --yes wrangler secret put CF_API_TOKEN;
          elif [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler secret put CF_API_TOKEN;
          else echo "CF_API_TOKEN not set, skip (R2 usage falls back to estimate)"; fi

      # secrets 写入后再次部署，确保机密随最新版本一起上线。
      # 必须用 wrangler@4（旧 v3 打包 node:net 仍是 unenv stub，nodejs_compat_v2 不生效）。
      - name: Redeploy with secrets
        run: npx --yes wrangler@4.128.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bump admin page version
        run: node .github/scripts/bump-version.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Upload admin.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 4 起 r2 object put 默认走本地存储，必须加 --remote 才写入云端 R2（缺了会假成功）
          command: r2 object put bot-telegram/admin.html --file=admin.html --content-type text/html --cache-control "public, max-age=300" --remote

      - name: Upload admin.html to R2 key "admin" (no ext, for /admin URL)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/admin --file=admin.html --content-type text/html --cache-control "public, max-age=300" --remote

      - name: Upload admin-guide.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/admin-guide.html --file=admin-guide.html --content-type text/html --cache-control "public, max-age=300" --remote

      - name: Upload user.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/user.html --file=user.html --content-type text/html --cache-control "public, max-age=300" --remote

      - name: Upload user-manage.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/user-manage.html --file=user-manage.html --content-type text/html --cache-control "public, max-age=300" --remote

      - name: Upload jx.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/jx.html --file=jx.html --content-type text/html --cache-control "public, max-age=300" --remote

      - name: Upload scrape.html to R2 (bot-telegram bucket)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put bot-telegram/scrape.html --file=scrape.html --content-type text/html --cache-control "public, max-age=300" --remote

      # 兼容历史裸 key 直接访问：早前部署上传的是 /admin /user /jx 这类无扩展名对象，
      # 后期改为只传 *.html 后裸 key 变成 404。这里每轮把页面再传一份无扩展名 key 保持原访问方式可用。
      - name: Upload no-extension keys for legacy direct URLs (/user /jx /admin-guide /user-manage /scrape)
        run: |
          for p in user jx admin-guide user-manage scrape; do
            npx --yes wrangler@4.128.0 r2 object put bot-telegram/$p --file=$p.html --content-type text/html --cache-control "public, max-age=300" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
