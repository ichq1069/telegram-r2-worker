name: Generate debug keystore (one-off)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate debug keystore and post base64 to summary
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          B64=$(base64 -w0 "$RUNNER_TEMP/debug.keystore")
          {
            echo "### ANDROID_DEBUG_KEYSTORE_B64"
            echo ""
            echo '```'
            echo "$B64"
            echo '```'
            echo ""
            echo "Copy the string above into a new repository secret named \`ANDROID_DEBUG_KEYSTORE_B64\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "base64 length: ${#B64} chars"
