# GitHub Actions：仅当 android/picwall_app 工程代码变动时构建 PicWall APK
# （android/specs 等文档改动不触发；specs 同时也不触发 Worker 部署）
# M1 阶段产出 debug 包；发布签名（release keystore）在 M4/T4.6 接入。
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/picwall_app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Flutter project not present yet
        id: check
        run: |
          if [ -f android/picwall_app/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.check.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Android artifacts / Java
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Scaffold Android platform (repo keeps Dart source only)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter create --platforms=android --org com.picwall --project-name picwall_app .

      - name: Declare runtime permissions & foreground service (scaffold inject)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          perms = (
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n'
          )
          if 'READ_MEDIA_IMAGES' not in s:
              s = re.sub(r'(<application\b)', perms + r'\1', s, count=1)
          service = ('    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"'
                     ' android:foregroundServiceType="dataSync" android:exported="false"/>\n')
          if 'com.pravera.flutter_foreground_task' not in s:
              m = re.search(r'<application\b[^>]*>', s)
              if m:
                  s = s[:m.end()] + '\n' + service + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          print('manifest permissions/service injected')
          PY

      - name: Flutter pub get
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter pub get

      - name: Analyze
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter analyze

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter test

      - name: Restore fixed debug keystore (stable APK signature for updates)
        if: steps.check.outputs.present == 'true' && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "Fixed debug keystore restored."

      - name: Build debug APK (M1; 发布签名将在 M4/T4.6 引入)
        if: steps.check.outputs.present == 'true'
        id: build
        working-directory: android/picwall_app
        run: |
          flutter build apk --debug
          echo "apk_path=build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=picwall-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_name }}
          path: android/picwall_app/${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
