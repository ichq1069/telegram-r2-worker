# GitHub Actions：仅当 android/picwall_app 工程代码变动时构建 PicWall APK
# （android/specs 等文档改动不触发；specs 同时也不触发 Worker 部署）
# M1 阶段产出 debug 包；发布签名（release keystore）在 M4/T4.6 接入。
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/picwall_app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 0.2.0). Leave empty to only increment build number.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Flutter project not present yet
        id: check
        run: |
          if [ -f android/picwall_app/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.check.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Android artifacts / Java
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Scaffold Android platform (repo keeps Dart source only)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter create --platforms=android --org com.picwall --project-name picwall_app .

      - name: Declare runtime permissions & foreground service (scaffold inject)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          perms = (
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n'
              '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n'
          )
          if 'READ_MEDIA_IMAGES' not in s:
              s = re.sub(r'(<application\b)', perms + r'\1', s, count=1)
          service = ('    <service android:name="com.pravera.flutter_foreground_task.service.ForegroundService"'
                     ' android:foregroundServiceType="dataSync" android:exported="false"/>\n')
          if 'com.pravera.flutter_foreground_task' not in s:
              m = re.search(r'<application\b[^>]*>', s)
              if m:
                  s = s[:m.end()] + '\n' + service + s[m.end():]
          s = re.sub(r'android:label="[^"]*"', 'android:label="图墙"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print('manifest permissions/service/label injected')
          PY

      - name: Use FlutterFragmentActivity host (local_auth biometrics)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: |
          python3 - <<'PY'
          import glob, re
          files = glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True)
          for p in files:
              s = open(p, encoding='utf-8').read()
              if 'FlutterFragmentActivity' in s:
                  print('already FlutterFragmentActivity:', p)
                  continue
              s = s.replace('import io.flutter.embedding.android.FlutterActivity',
                            'import io.flutter.embedding.android.FlutterFragmentActivity')
              s = s.replace('FlutterActivity()', 'FlutterFragmentActivity()')
              open(p, 'w', encoding='utf-8').write(s)
              print('patched to FlutterFragmentActivity:', p)
          PY

      - name: Wire FileProvider APK install (method channel)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: |
          python3 - <<'PY'
          import os, re, glob

          # 1) Manifest: declare androidx FileProvider so the app can hand the
          #    downloaded APK to the system installer over content:// (file://
          #    triggers FileUriExposedException on API 24+).
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          provider = (
              '    <provider\n'
              '        android:name="androidx.core.content.FileProvider"\n'
              '        android:authorities="${applicationId}.fileprovider"\n'
              '        android:exported="false"\n'
              '        android:grantUriPermissions="true">\n'
              '        <meta-data\n'
              '            android:name="android.support.FILE_PROVIDER_PATHS"\n'
              '            android:resource="@xml/file_paths" />\n'
              '    </provider>\n'
          )
          if 'FileProvider' not in s:
              m = re.search(r'<application\b[^>]*>', s)
              s = s[:m.end()] + '\n' + provider + s[m.end():]
              open(p, 'w', encoding='utf-8').write(s)
              print('fileprovider injected into manifest')
          else:
              print('fileprovider already present')

          # 2) Provider path map: APK lands in the app cache dir.
          os.makedirs('android/app/src/main/res/xml', exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="update" path="." />
              <external-cache-path name="update_ext" path="." />
          </paths>
          '''
          open('android/app/src/main/res/xml/file_paths.xml', 'w', encoding='utf-8').write(xml)

          # 3) MainActivity: MethodChannel "picwall/install" -> ACTION_VIEW with
          #    FileProvider content URI + read grant.
          files = glob.glob('android/app/src/main/kotlin/**/MainActivity.kt', recursive=True)
          for mp in files:
              src = open(mp, encoding='utf-8').read()
              if 'picwall/install' in src:
                  print('install channel already wired:', mp)
                  continue
              imports = (
                  'import android.content.Intent\n'
                  'import android.net.Uri\n'
                  'import android.provider.Settings\n'
                  'import androidx.core.content.FileProvider\n'
                  'import io.flutter.embedding.engine.FlutterEngine\n'
                  'import io.flutter.plugin.common.MethodChannel\n'
                  'import java.io.File\n'
              )
              lines = src.split('\n')
              last_import = max(i for i, l in enumerate(lines) if l.startswith('import '))
              lines = lines[:last_import + 1] + imports.rstrip().split('\n') + lines[last_import + 1:]
              src = '\n'.join(lines)
              body = "\n".join([
                  "    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {",
                  "        super.configureFlutterEngine(flutterEngine)",
                  "        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, \"picwall/install\")",
                  "            .setMethodCallHandler { call, result ->",
                  "                when (call.method) {",
                  "                    \"installApk\" -> {",
                  "                        val path = call.argument<String>(\"path\")",
                  "                        if (path == null) {",
                  "                            result.error(\"bad_argument\", \"missing apk path\", null)",
                  "                            return@setMethodCallHandler",
                  "                        }",
                  "                        try {",
                  "                            val file = File(path)",
                  "                            val uri: Uri = FileProvider.getUriForFile(this, \"$packageName.fileprovider\", file)",
                  "                            val intent = Intent(Intent.ACTION_VIEW).apply {",
                  "                                setDataAndType(uri, \"application/vnd.android.package-archive\")",
                  "                                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)",
                  "                            }",
                  "                            startActivity(intent)",
                  "                            result.success(true)",
                  "                        } catch (e: android.content.ActivityNotFoundException) {",
                  "                            result.error(\"no_installer\", \"未找到可用的安装程序\", null)",
                  "                        } catch (e: Exception) {",
                  "                            result.error(\"install_failed\", e.message ?: \"安装失败\", null)",
                  "                        }",
                  "                    }",
                  "                    \"canInstall\" -> {",
                  "                        val ok = try { packageManager.canRequestPackageInstalls() } catch (e: Exception) { false }",
                  "                        result.success(ok)",
                  "                    }",
                  "                    \"openInstallSettings\" -> {",
                  "                        result.success(openInstallSettings())",
                  "                    }",
                  "                    else -> result.notImplemented()",
                  "                }",
                  "            }",
                  "    }",
                  "",
                  "    private fun openInstallSettings(): Boolean {",
                  "        return try {",
                  "            val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES)",
                  "            intent.data = Uri.parse(\"package:$packageName\")",
                  "            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)",
                  "            startActivity(intent)",
                  "            true",
                  "        } catch (e: android.content.ActivityNotFoundException) {",
                  "            try {",
                  "                val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)",
                  "                intent.data = Uri.parse(\"package:$packageName\")",
                  "                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)",
                  "                startActivity(intent)",
                  "                true",
                  "            } catch (e2: Exception) {",
                  "                false",
                  "            }",
                  "        }",
                  "    }",
              ])
              src = src.rstrip()
              if src.endswith('}'):
                  src = src[:-1].rstrip() + '\n' + body + '}\n'
              open(mp, 'w', encoding='utf-8').write(src)
              print('install channel wired:', mp)
          PY

      - name: Flutter pub get
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter pub get

      - name: Apply launcher icon (flutter_launcher_icons)
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter pub run flutter_launcher_icons

      - name: Analyze
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter analyze

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: flutter test

      - name: Auto-increment build number and version
        if: steps.check.outputs.present == 'true'
        working-directory: android/picwall_app
        run: |
          python3 - <<'PY'
          import re, os
          p = 'pubspec.yaml'
          s = open(p).read()
          run = os.environ.get('RUN_NUMBER', '1')
          ver = os.environ.get('INPUT_VERSION', '').strip()
          if ver:
              s = re.sub(r'version:\s+\d+\.\d+\.\d+\+\d+', f'version: {ver}+{run}', s)
              print(f'version set to {ver}+{run}')
          else:
              s = re.sub(r'(version:\s+\d+\.\d+\.\d+\+)\d+', rf'\g<1>{run}', s)
              print(f'build number set to {run}')
          open(p, 'w').write(s)
          PY
        env:
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # 体积说明：此前 --debug 会同时打进 4 个 ABI 的 JIT 引擎与原生库
      # （+60 时代已 ~130MB，media_kit 软解加入后达 213MB）。改为
      # --release（AOT + 裁剪）且仅编 android-arm64 单架构，APK 预计降至
      # 数十 MB 量级；armeabi-v7a(32 位) 旧机暂不支持，后续可按需补发。
      - name: Ensure debug keystore for release signing
        if: steps.check.outputs.present == 'true'
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "generated debug keystore for release signing"
          else
            echo "debug keystore exists"
          fi
      - name: Build release APK arm64 (确定性重签在下一步进行)
        if: steps.check.outputs.present == 'true'
        id: build
        working-directory: android/picwall_app
        run: |
          flutter build apk --release --target-platform android-arm64
          echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=picwall.apk" >> "$GITHUB_OUTPUT"

      # gradle 每次构建都会用随机生成的 debug.keystore 签名（restore 到 $HOME 不生效，
      # 已取证：+60 与 +61 产物 cert SHA-256 不同）。这里用固定 keystore 对产物做确定性
      # 重签，保证 APK 更新线所有版本同一签名、可被应用内更新无缝覆盖安装。
      - name: Re-sign APK with fixed keystore (stable in-app update signature)
        if: steps.check.outputs.present == 'true' && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        working-directory: android/picwall_app
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=/tmp/android-build-tools
          if [ ! -f "$BT/android-14/apksigner" ] && [ ! -f "$BT/android-14/lib/apksigner.jar" ]; then
            mkdir -p "$BT"
            curl -fsSL -o "$BT/bt.zip" https://dl.google.com/android/repository/build-tools_r34-linux.zip
            unzip -oq "$BT/bt.zip" -d "$BT"
          fi
          ZA="$BT/android-14/zipalign"
          ASJAR="$BT/android-14/lib/apksigner.jar"
          KS="/tmp/fixed-debug.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          "$ZA" -f 4 "$APK" /tmp/picwall-aligned.apk
          java -jar "$ASJAR" sign \
            --ks "$KS" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" /tmp/picwall-aligned.apk
          java -jar "$ASJAR" verify --print-certs "$APK"

      - name: Upload APK artifact
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_name }}
          path: android/picwall_app/${{ steps.build.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish rolling GitHub Release (artifact backup only)
        if: steps.check.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version: //p' android/picwall_app/pubspec.yaml | tr -d ' \r')
          echo "Releasing PicWall v${VERSION}"
          # 清掉上一个滚动发布，保证 /releases/latest 始终指向最新构建
          gh release list --limit 50 --json tagName --jq '.[].tagName' | while IFS= read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
          gh release create "v${VERSION}" \
            android/picwall_app/build/app/outputs/flutter-apk/app-release.apk \
            --title "PicWall ${VERSION}" \
            --notes "自动构建 ${VERSION} · commit ${GITHUB_SHA:0:7}" \
            --target "${GITHUB_SHA}"

      # 应用内更新源切到 R2 公开静态托管（telegramup.wo58.cn，GitHub 仓库私有不可作更新源）：
      # 上传固定文件名 apk/picwall-latest.apk + 版本清单 apk/latest.json，Worker /api/app/update 读取。
      - name: Upload APK + latest.json to R2 (in-app update source)
        if: steps.check.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          VERSION=$(sed -n 's/^version: //p' android/picwall_app/pubspec.yaml | tr -d ' \r')
          APK=android/picwall_app/build/app/outputs/flutter-apk/app-release.apk

          # 固定文件名，避免版本号里 '+' 等字符在 URL/缓存上的麻烦
          npx --yes wrangler@4.128.0 r2 object put bot-telegram/apk/picwall-latest.apk \
            --file="$APK" --content-type application/vnd.android.package-archive \
            --cache-control "no-cache" --remote

          python3 - "$VERSION" <<'PY'
          import json, sys, os, datetime
          ver = sys.argv[1]
          manifest = {
            "version": ver,
            "published_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "body": "自动构建 v{} · commit {}".format(ver, os.environ.get("GITHUB_SHA", "")[:7]),
          }
          open("latest.json", "w").write(json.dumps(manifest, ensure_ascii=False))
          PY

          npx --yes wrangler@4.128.0 r2 object put bot-telegram/apk/latest.json \
            --file=latest.json --content-type application/json \
            --cache-control "no-cache" --remote
          echo "R2 update source updated: v${VERSION}"
