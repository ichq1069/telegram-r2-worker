# Cloudflare Workers 部署配置（GitHub Actions 自动部署用）
# 注意：TG_BOT_TOKEN / API_KEY / TG_SECRET 属于机密，不写在此文件！
# 它们继续在 Cloudflare Dashboard → Workers → Settings → Variables and Secrets 配置，
# wrangler deploy 不会删除 Dashboard 里已存在的 secrets。
# 如果本机用 `wrangler deploy` 部署前，请先 `wrangler secret put` 补齐这三个。

name = "telegram-r2-bot"
main = "worker.js"
compatibility_date = "2026-08-01"   # 若线上运行正常，可从 Dashboard 复制原值覆盖此项，避免行为变化

# 公开变量（非密钥）
[vars]
R2_PUBLIC_URL = "https://telegramup.wo58.cn"

# R2 存储桶绑定
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bot-telegram"
smart_tiered_cache = true   # 智能分层缓存：热数据 CDN 缓存、冷数据按需回源，读性能更好且省钱

# D1 数据库绑定（telegram-url，含 files/random_pool/settings/api_keys 等表）
[[d1_databases]]
binding = "D1_DB"
database_name = "telegram-url"
database_id = "daaf94cd-ff23-4273-843d-caba8a3453ca"

# Queue：批量转存时 webhook 只做「秒回记录 + 入队」，下载/上传交给后台队列。
# 每条消息有 15 分钟宽限 + 自动重试，避免 waitUntil 30 秒墙钟限制导致批量转发丢文件。
[[queues.producers]]
binding = "FILE_QUEUE"
queue = "file-processing"

[[queues.consumers]]
queue = "file-processing"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3

# Cron 触发器：scheduled() 兜底轮询。
# handlePollUpdates 只轮询 TG_API_BASES（本地 Bot API），未配置时直接返回、不影响 webhook；
# 若以后配置本地 Bot API，即可用 Local file_id 支持 >20MB 大文件转存。
[triggers]
crons = ["*/5 * * * *"]
