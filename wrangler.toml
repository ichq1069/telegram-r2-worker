# Cloudflare Workers 部署配置（GitHub Actions 自动部署用）
# 注意：TG_BOT_TOKEN / API_KEY / TG_SECRET 属于机密，不写在此文件！
# 它们继续在 Cloudflare Dashboard → Workers → Settings → Variables and Secrets 配置，
# wrangler deploy 不会删除 Dashboard 里已存在的 secrets。
# 如果本机用 `wrangler deploy` 部署前，请先 `wrangler secret put` 补齐这三个。

name = "telegram-r2-bot"
main = "worker.js"
compatibility_date = "2026-08-31"   # >=2026-08-04 默认启用完整 nodejs_compat(v2)：真实 TCP socket（node:net connect），mysql2 可用
# 注意：不要显式写 compatibility_flags = ["nodejs_compat", "nodejs_compat_v2"]
# wrangler 4.128+ 判定两者互斥报错；且该日期下两者均已默认开启，v2 也被 nodejs_compat 隐含（自 2024-09-23）

# 公开变量（非密钥）
[vars]
R2_PUBLIC_URL = "https://telegramup.wo58.cn"
# Cloudflare 账号 ID（GraphQL Analytics 查 R2 官方用量用；机密 Token 见 secret CF_API_TOKEN）
CF_ACCOUNT_ID = "77fc93b832a9f816ee841c3a321b57b5"

# R2 存储桶绑定（R2 Smart Tiering 属桶级/zone 级设置，请在 R2 Dashboard 开启，此处不支持）
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bot-telegram"

# D1 数据库绑定（telegram-url，含 files/random_pool/settings/api_keys 等表）
[[d1_databases]]
binding = "D1_DB"
database_name = "telegram-url"
database_id = "daaf94cd-ff23-4273-843d-caba8a3453ca"

# Hyperdrive 绑定：直连 VPS MySQL（相册数据存储）
# 在 Cloudflare Dashboard → Workers → Settings → Bindings → Hyperdrive 创建后，
# 将生成的 ID 填入下方。连接字符串格式：
#   postgresql://telequnphoto:telequnphoto@84.247.129.220:3306/telequnphoto
[[hyperdrive]]
binding = "telequnphoto"
id = "6bb259268fc2464ea4fd30b63e75d3ac"

# Cron 触发器：scheduled() 兜底轮询 + 未转存自动补齐 + 查重后台化 + webhook 自愈
# "0 1 * * *" = UTC 01:00（北京时间 09:00）日报推送
[triggers]
crons = ["*/2 * * * *", "0 1 * * *"]

# 可观测性：Workers Logs（免费额度 200k 事件/天）
[observability]
enabled = true
head_sampling_rate = 1
